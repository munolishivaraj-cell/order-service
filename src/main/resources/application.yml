spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, Hibernate only validates it
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true             # Java 21 virtual threads for request handling

server:
  port: ${PORT:8080}
  shutdown: graceful            # finish in-flight requests on ECS task stop

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness
      show-details: when-authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # enables p95/p99 latency in Grafana
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  observations:
    annotations:
      enabled: true

logging:
  pattern:
    # traceId/spanId in every log line, so a log can be matched to its trace in Jaeger
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
